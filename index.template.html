<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Fusion Review | 图像融合论文与代码</title><meta name="description" content="Image fusion papers and code: infrared-visible, medical, multi-focus, multi-exposure and video fusion. 图像融合顶会顶刊论文分类与代码索引。">
<style>
:root{--bg:#f5f6f9;--ink:#1d2b42;--muted:#65758b;--line:#e2e7ee;--accent:#295ab1}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;color:var(--ink)}header{background:#142b4d;color:white;padding:44px max(24px,calc((100vw - 1450px)/2));position:relative;overflow:hidden}header:after{content:"";position:absolute;width:330px;height:330px;border:50px solid #ffffff09;transform:rotate(35deg);right:7%;top:-180px;pointer-events:none}.eyebrow{letter-spacing:.19em;font-size:12px;color:#a9c5ee}h1{font-size:44px;letter-spacing:-.04em;margin:12px 0}header p{color:#c1d1e8;max-width:750px;font-size:14px;line-height:1.8}header a{color:#dbe8fc;text-decoration:none;margin-right:22px;font-size:13px}main{max-width:1500px;margin:24px auto;padding:0 24px}.stats{display:flex;gap:10px;margin:0 0 20px;flex-wrap:wrap}.stat{background:white;border:1px solid var(--line);border-radius:10px;padding:12px 20px;font-size:13px;color:var(--muted)}.stat strong{font-size:21px;color:var(--ink);padding-right:8px}.filters{background:white;border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;grid-template-columns:2.3fr repeat(4,1fr);gap:12px}label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px}input,select{font:inherit;font-size:13px;border:1px solid #d6dfe9;border-radius:7px;width:100%;padding:10px;background:white;color:var(--ink)}input:focus,select:focus{outline:2px solid #98baf2;outline-offset:1px}.toolbar{display:flex;justify-content:space-between;align-items:center;margin:18px 0;font-size:13px;color:var(--muted);gap:10px}button{cursor:pointer;border:1px solid var(--line);background:white;border-radius:7px;padding:8px 13px;color:var(--ink)}button:hover{background:#eaf0f9}.wrap{border:1px solid var(--line);border-radius:12px;overflow:auto;background:white}table{width:100%;border-collapse:collapse;min-width:1060px;font-size:13px}thead{background:#edf1f7}th{font-size:11px;letter-spacing:.04em;color:#52657d;text-align:left;padding:15px}td{padding:17px 15px;border-top:1px solid var(--line);vertical-align:top;line-height:1.6}tr:hover td{background:#f9fbff}.method{font-weight:700;color:#173d73;white-space:nowrap}.title{max-width:430px;min-width:270px}.title small{display:block;color:var(--muted);margin-top:4px}.year{white-space:nowrap}.tag{display:inline-block;border-radius:4px;background:#edf2fa;color:#486283;font-size:11px;padding:2px 6px;margin:2px 3px 2px 0}.links a{display:block;color:var(--accent);text-decoration:none;white-space:nowrap}.links a:hover{text-decoration:underline}.status{font-size:11px;min-width:110px;color:#647488}.status.pending{color:#966321}.status.preprint{color:#76629c}.note{font-size:12px;color:var(--muted);line-height:1.8}footer{color:var(--muted);font-size:12px;margin:20px 0 40px}.empty{text-align:center;padding:45px;color:var(--muted)}@media(max-width:1100px){.filters{grid-template-columns:repeat(3,1fr)}.search{grid-column:span 3}}@media(max-width:600px){header{padding:28px 20px}h1{font-size:34px}main{padding:0 14px}.filters{grid-template-columns:repeat(2,1fr)}.search{grid-column:span 2}.toolbar{flex-wrap:wrap}.stat{padding:10px}.stat strong{font-size:18px}}
</style></head><body>
<header><div class="eyebrow">IMAGE FUSION PAPERS &amp; CODE</div><h1>Image Fusion Review</h1><p>图像融合论文与代码，涵盖红外与可见光、医学图像、多聚焦、多曝光和视频融合。<br>更新于 2026-10-09</p><nav><a href="README.md">GitHub 综述表格</a><a href="data/papers.csv" download>完整 CSV</a><a href="docs/methodology.md">来源与核对规则</a></nav></header>
<main><div class="stats" id="stats"></div><section class="filters" aria-label="文献筛选">
<div class="search"><label for="search">关键词 · 方法 / 标题 / 会议 / 标签</label><input id="search" type="search" placeholder="例如 diffusion、医学、配准、CVPR"></div>
<div><label for="task">应用任务</label><select id="task"><option value="">全部任务</option></select></div>
<div><label for="year">年份</label><select id="year"><option value="">全部年份</option></select></div>
<div><label for="tag">技术 / 问题</label><select id="tag"><option value="">全部标签</option></select></div>
<div><label for="code">代码入口</label><select id="code"><option value="">全部</option><option value="linked">有仓库链接</option><option value="pending">仅公告 / 待实现</option><option value="missing">未定位仓库</option></select></div></section>
<div class="toolbar"><span id="count" role="status" aria-live="polite"></span><div><button id="reset">重置筛选</button> <button id="export">导出筛选结果</button></div></div>
<div class="wrap"><table><thead><tr><th>方法 / 年份</th><th>论文标题 / 发表</th><th>应用任务</th><th>技术与问题</th><th>论文 / 仓库</th></tr></thead><tbody id="rows"></tbody></table></div>
<p class="note">部分仓库尚未发布实现；具体代码状态与来源见 CSV。本文献表不包含复现实验。</p><footer><a href="https://github.com/Crescent-hxy/fusion-review">Crescent-hxy / fusion-review</a> · 欢迎补充论文与代码</footer></main>
<script>
const papers=__PAPERS__,tasks=__TASKS__;
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const option=(value,text)=>{const o=document.createElement('option');o.value=value;o.textContent=text;return o};
Object.entries(tasks).forEach(([k,v])=>$('task').append(option(k,v)));
[...new Set(papers.map(p=>p.year))].sort((a,b)=>b-a).forEach(y=>$('year').append(option(y,y)));
[...new Set(papers.flatMap(p=>p.tags))].sort((a,b)=>a.localeCompare(b,'zh-CN')).forEach(t=>$('tag').append(option(t,t)));
const stats=[['论文',papers.length],['2025–2026',papers.filter(p=>p.year>=2025).length],['医学相关',papers.filter(p=>p.tasks.includes('medical')).length],['2026 年',papers.filter(p=>p.year===2026).length]];
$('stats').innerHTML=stats.map(([l,n])=>`<div class="stat"><strong>${n}</strong>${l}</div>`).join('');
let selected=[];const pending=p=>/仅公告|尚未/.test(p.code_status);
function filter(){const q=$('search').value.trim().toLowerCase();selected=papers.filter(p=>(!q||[p.name,p.title,p.venue,p.year,...p.tags,...p.tasks.map(t=>tasks[t])].join(' ').toLowerCase().includes(q))&&(!$('task').value||p.tasks.includes($('task').value))&&(!$('year').value||p.year===Number($('year').value))&&(!$('tag').value||p.tags.includes($('tag').value))&&(!$('code').value||($('code').value==='linked'?!!p.code:$('code').value==='pending'?pending(p):!p.code)));render()}
function url(u,label){return u&&/^https?:\/\//.test(u)?`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${label} ↗</a>`:'<span>—</span>'}
function render(){$('count').textContent=`显示 ${selected.length} / ${papers.length} 个条目`; $('rows').innerHTML=selected.length?selected.map(p=>`<tr><td><div class="method">${esc(p.name)}</div><span class="year">${p.year}</span></td><td class="title">${esc(p.title)}<small>${esc(p.venue)}</small></td><td>${p.tasks.map(t=>`<span class="tag">${esc(tasks[t])}</span>`).join('')}</td><td>${p.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</td><td class="links">${url(p.paper,'Paper')}${url(p.code,'Repository')}</td></tr>`).join(''):'<tr><td colspan="5" class="empty">没有符合条件的条目，请调整筛选。</td></tr>'}
['search','task','year','tag','code'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',filter));
$('reset').addEventListener('click',()=>{['search','task','year','tag','code'].forEach(id=>$(id).value='');filter()});
$('export').addEventListener('click',()=>{const keys=['name','title','year','venue','tasks','tags','paper','code','publication_status','verification','code_status','sources','checked_at','note'];const quote=v=>'"'+String(Array.isArray(v)?v.join('; '):v??'').replace(/"/g,'""')+'"';const csv='\ufeff'+[keys,...selected.map(p=>keys.map(k=>p[k]))].map(r=>r.map(quote).join(',')).join('\r\n');const u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));const a=document.createElement('a');a.href=u;a.download='fusion-review-filtered.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)});
filter();
</script></body></html>
